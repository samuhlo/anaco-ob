<!doctype html><html><head><meta charset="utf-8"><title>Visor que pinta tarde</title></head><body><div class="pdfViewer"><div class="page" data-page-number="1" data-loaded="true" style="width:400px;height:500px;margin-bottom:900px"><canvas width="400" height="500" data-number="1"></canvas></div><div class="page" data-page-number="2" data-loaded="true" style="width:400px;height:500px;margin-bottom:900px"><canvas width="400" height="500" data-number="2"></canvas></div></div><script>const wait=setInterval(()=>{if(!document.body.dataset.paint)return;clearInterval(wait);setTimeout(()=>{for(const canvas of document.querySelectorAll("canvas")){const c=canvas.getContext("2d");c.fillStyle="#34234f";c.fillRect(0,0,400,500);c.fillStyle="white";c.font="28px sans-serif";c.fillText("PAGINA PINTADA "+canvas.dataset.number,20,80);}},1500);},100);</script></body></html>
