name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every key in both languages, and the generated catalog up to date.
      - run: python3 scripts/i18n.py check
      # Unit tests of the extension modules.
      - run: npm test
      # Mozilla's validator: errors block signing on addons.mozilla.org.
      - run: npm run lint
      # The package that is uploaded to addons.mozilla.org.
      - run: npm run build

  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # PDF fixtures need Ghostscript (ps2pdf); PDF and media tests call Poppler and FFmpeg.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg ghostscript
      - run: python -m unittest discover -s tests -v

  install:
    # Real install with pipx and a framed Native Messaging round trip on each system.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_installer -v
      - run: pipx install .
      - run: mkdir vault-ci
      - run: anaco-ob install --vault vault-ci
      - run: anaco-ob doctor || true
      - run: python scripts/smoke_native_host.py
      - run: anaco-ob uninstall --purge

  process-lifecycle:
    # Exercise real process trees and JSONL pipes, not just installation.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p test_processes.py -v
      - run: python -m unittest discover -s tests -p test_transcription_progress.py -v

  bootstrap:
    # The one-line install shown on the welcome page, from this checkout, on each system.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ANACO_OB_SOURCE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: sh scripts/install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1
      - run: python scripts/smoke_native_host.py
